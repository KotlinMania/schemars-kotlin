[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
kotlinxBenchmark = "0.5.0"
ktlintEngine = "1.8.0"
bytes = "0.2.1"
indexmap = "0.1.5"
prettyAssertions = "0.1.0"
regex = "0.1.0"
serde = "0.1.11"
uuid = "0.1.2"
either = "0.1.1"
semver = "0.3.1"
serdeJson = "0.1.1"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
bytes-kotlin = { module = "io.github.kotlinmania:bytes-kotlin", version.ref = "bytes" }
indexmap-kotlin = { module = "io.github.kotlinmania:indexmap-kotlin", version.ref = "indexmap" }
pretty-assertions-kotlin = { module = "io.github.kotlinmania:pretty-assertions-kotlin", version.ref = "prettyAssertions" }
regex-kotlin = { module = "io.github.kotlinmania:regex-kotlin", version.ref = "regex" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
uuid-kotlin = { module = "io.github.kotlinmania:uuid-kotlin", version.ref = "uuid" }
either-kotlin = { module = "io.github.kotlinmania:either-kotlin", version.ref = "either" }
semver-kotlin = { module = "io.github.kotlinmania:semver-kotlin", version.ref = "semver" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }

[bundles]
schemars-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "bytes-kotlin",
  "indexmap-kotlin",
  "regex-kotlin",
  "serde-kotlin",
  "uuid-kotlin",
  "either-kotlin",
  "semver-kotlin",
  "serde-json-kotlin",
]
schemars-commonTest = [
  "pretty-assertions-kotlin",
]
